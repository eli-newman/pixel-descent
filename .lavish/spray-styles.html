<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Descent - Brake Spray Styles</title>
<style>
:root{--bg:#000;--fg:#fff;--dim:#8a8a8a;--acc:#f5d742;--line:#2a2a2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 ui-monospace,Menlo,monospace;padding:32px 20px 64px}
h1{font-size:22px;margin:0 0 6px}
p.lead{color:var(--dim);margin:0 0 28px;max-width:70ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px}
.card[data-cur="1"]{border-color:var(--acc)}
canvas{width:100%;aspect-ratio:3/4;image-rendering:pixelated;background:#000;border:1px solid var(--line)}
h2{font-size:16px;margin:0;display:flex;gap:8px;align-items:center}
h2 b{color:var(--acc)}
.tag{font-size:11px;color:#000;background:var(--acc);padding:1px 6px}
p{margin:0;color:var(--dim);font-size:13px}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:20px;color:var(--dim);font-size:13px}
button{font:inherit;background:#000;color:var(--fg);border:1px solid var(--fg);padding:4px 12px;cursor:pointer}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body>
<h1>Brake spray styles</h1>
<p class="lead">Each loop: ride fast, hold A+D to skid for about 1.5s, release, repeat. Same rider, same speed curve, only the snow differs. Click a card's name or annotate the style you want.</p>
<div class="bar"><button id="pause">Pause all</button><span>Loops forever. Number 1 is what the game does now.</span></div>
<div class="grid" id="grid"></div>
<script>
const W=90,H=120,CX=45,CY=70;
let paused=false;
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume all':'Pause all'};
function rng(seed){let s=seed;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
// Style = how particles spawn + what overlays draw. Particles are in screen px, velocity relative to rider.
const STYLES=[
{name:'Plume + face shot',cur:1,note:'Now in the game: a tall plume above the board, flecks off both edges, and a dither over his head at the peak.',
 spawn(S,P,R,b,sp){const n=2+Math.round(8*b*sp);for(let i=0;i<n;i++)P.push({x:CX+(R()-.5)*6,y:CY-3,vx:(R()-.5)*44,vy:-(70+80*b*sp)*(.55+R()*.6)/3.2,l:.75*(.6+R()*.4),m:.75,s:1});
  for(const d of[-7,7])for(let i=0;i<n/2;i++)P.push({x:CX+d,y:CY+1,vx:(R()-.5)*28,vy:-(60+50*b*sp)*(.55+R()*.6)/3.2,l:.6,m:.6,s:1})},
 over(c,S,b,sp,t){face(c,S,b*sp>.3?.85:0,t,15,9,7)}},
{name:'Side slash fan',note:'How a real slash looks: powder thrown out sideways in a low wide fan off the downhill edge, no face blast.',
 spawn(S,P,R,b,sp){const n=3+Math.round(9*b*sp);for(let i=0;i<n;i++){const d=i%2?1:-1;P.push({x:CX+d*5,y:CY+2,vx:d*(30+R()*70)*(.5+b*sp),vy:-(14+R()*38)*(.5+b*sp),l:.7*(.6+R()*.4),m:.7,s:1})}},
 over(){}},
{name:'Rooster tail',note:'Powder kicked up and back behind the board in a tall narrow arc, like a jet-ski wake. Trails him instead of hitting him.',
 spawn(S,P,R,b,sp){const n=3+Math.round(8*b*sp);for(let i=0;i<n;i++)P.push({x:CX+(R()-.5)*4,y:CY+6,vx:(R()-.5)*14,vy:-(40+R()*70)*(.4+b*sp)/1.4,l:1.1*(.6+R()*.4),m:1.1,s:1})},
 over(){}},
{name:'Whiteout',note:'Plume plus a heavy dither that swallows the whole lower half of the screen at the peak. Dramatic, hides obstacles.',
 spawn(S,P,R,b,sp){const n=3+Math.round(9*b*sp);for(let i=0;i<n;i++)P.push({x:CX+(R()-.5)*8,y:CY-3,vx:(R()-.5)*60,vy:-(60+90*b*sp)*(.5+R()*.6)/3.2,l:.8*(.6+R()*.4),m:.8,s:1})},
 over(c,S,b,sp,t){const k=b*sp>.25?Math.min(1,b*sp*1.3):0;screenFog(c,S,k,t)}},
{name:'Chunky puffs',note:'Big 2x2 and 3x3 blobs that grow then shrink, with a dithered halo. Reads as thick powder at low res.',
 spawn(S,P,R,b,sp){const n=1+Math.round(5*b*sp);for(let i=0;i<n;i++)P.push({x:CX+(R()-.5)*8,y:CY-2,vx:(R()-.5)*36,vy:-(50+70*b*sp)*(.5+R()*.6)/3.2,l:.9*(.6+R()*.4),m:.9,s:2,blob:1})},
 over(c,S,b,sp,t){face(c,S,b*sp>.3?.6:0,t,15,9,7)}},
{name:'Face-only flurry',note:'Almost no plume. Snow flecks fly outward from his head toward the screen edges, like it is coming at the camera.',
 spawn(S,P,R,b,sp){const n=2+Math.round(7*b*sp);for(let i=0;i<n;i++){const a=R()*Math.PI*2,v=(25+R()*60)*(.5+b*sp);P.push({x:CX,y:CY-10,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.8,l:.6*(.6+R()*.4),m:.6,s:1,flat:1})}},
 over(c,S,b,sp,t){face(c,S,b*sp>.3?.9:0,t,17,10,8)}}
];
function face(c,S,k,t,hh,hw,top){S.fk+= (k-S.fk)*(k>S.fk?.15:.1);if(S.fk<.05)return;
 const fl=Math.floor(t*24)%2;c.fillStyle='#fff';
 for(let dy=-hh;dy<=-2;dy++)for(let dx=-hw;dx<=hw;dx++){const e=1-(Math.abs(dx)/(hw+1)+Math.abs(dy+hh/2+1)/(hh/2+1))/2;const h=((dx*7+dy*13+fl*5)&7)/8;
  if(h<S.fk*e*.9&&(dx+dy+fl)%2===0)c.fillRect(CX+dx,CY+dy,1,1)}}
function screenFog(c,S,k,t){S.fk+=(k-S.fk)*(k>S.fk?.12:.07);if(S.fk<.04)return;const fl=Math.floor(t*20)%2;c.fillStyle='#fff';
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const edge=Math.max(0,1-Math.hypot((x-CX)/46,(y-CY+4)/40));
  const h=((x*7+y*13+fl*5)&7)/8;if(h<S.fk*(edge*.95)&&(x+y+fl)%2===0)c.fillRect(x,y,1,1)}}
function rider(c,b,t){c.fillStyle='#fff';
 // body + head
 c.fillRect(CX-1,CY-9,3,2);c.fillRect(CX-2,CY-7,5,7);
 // board: tall when straight, sideways when braking
 const w=Math.round(2+b*8),h=Math.round(10-b*7);c.fillRect(CX-Math.round(w/2),CY-2+ (b>.5?3:0),w,h-(b>.5?0:0)>2?h:2);
 c.fillStyle='#000';c.fillRect(CX-1,CY-8,1,1)}
function mk(style,i){
 const card=document.createElement('div');card.className='card';if(style.cur)card.dataset.cur=1;
 card.innerHTML=`<h2><b>${i+1}</b>${style.name}${style.cur?'<span class="tag">CURRENT</span>':''}</h2><canvas width="${W}" height="${H}"></canvas><p>${style.note}</p>`;
 document.getElementById('grid').appendChild(card);
 const cv=card.querySelector('canvas'),c=cv.getContext('2d');
 const R=rng(7+i),P=[],S={fk:0};const bg=[];const rb=rng(99);for(let k=0;k<40;k++)bg.push({x:rb()*W,y:rb()*H});
 let t=0,last=performance.now(),scroll=0;
 function frame(){const now=performance.now();let dt=Math.min(.05,(now-last)/1000);last=now;if(paused)return;stepf(dt)}
 function stepf(dt){t+=dt;
  const ph=t%3.4;const braking=ph>.7&&ph<2.3;const b=Math.max(0,Math.min(1,braking?(ph-.7)/.12:1-(ph-2.3)/.18));
  const sp=braking?Math.max(.25,1-(ph-.7)/1.5*.75):.25+Math.min(.75,(ph<.7?ph/.7:(ph-2.3)/1.1)*.75*(ph<.7?1:1));
  const speed=ph<.7?1:braking?Math.max(.15,1-(ph-.7)*.9):Math.min(1,.15+(ph-2.3)*.8);
  const sps=speed;
  scroll+=dt*(40+120*speed);
  if(braking&&speed>.2&&Math.floor(t*40)!==Math.floor((t-dt)*40)&&Math.floor(t*40)%1===0&&Math.floor(t*13.3)!==Math.floor((t-dt)*13.3))style.spawn(S,P,R,Math.min(1,.4+(ph-.7)/.5),sps);
  for(let j=P.length-1;j>=0;j--){const p=P[j];p.l-=dt;if(p.l<=0){P.splice(j,1);continue}
   p.vy+=(p.flat?0:60)*dt*.3;p.x+=p.vx*dt;p.y+=p.vy*dt+(.3+speed*.9)*dt*40*0.5;p.vx*=.98}
  c.fillStyle='#000';c.fillRect(0,0,W,H);c.fillStyle='#fff';
  for(const d of bg){const y=((d.y-scroll*0.6)%H+H)%H;c.fillRect(Math.round(d.x),Math.round(y),1,1)}
  rider(c,b,t);
  for(const p of P){const lf=p.l/p.m;if(lf<.25&&Math.floor(p.l*20)%2===0)continue;
   let s=p.s;if(p.blob)s=lf>.6?2:lf>.3?3:2;c.fillStyle='#fff';c.fillRect(Math.round(p.x),Math.round(p.y),s,s);
   if(p.blob&&lf>.3&&(Math.round(p.x)+Math.round(p.y))%2===0){c.fillRect(Math.round(p.x)-1,Math.round(p.y)+1,1,1);c.fillRect(Math.round(p.x)+s,Math.round(p.y)-1,1,1)}}
  c.fillStyle='#fff';style.over(c,S,Math.min(1,braking?.4+(ph-.7)/.5:0),braking?sps:0,t);
  c.fillStyle='#f5d742';c.fillRect(2,2,Math.round(40*speed),2);
 }
 const ff=+new URLSearchParams(location.search).get('at');if(ff){for(let k=0;k<ff*60;k++)stepf(1/60);paused=true}
 setInterval(frame,16);
}
STYLES.forEach(mk);
</script></body></html>
