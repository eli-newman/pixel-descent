<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Pixel Descent - a one-colour pixel-art downhill snowboard game."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8'/%3E%3Cpath fill='%23fff' d='M1 6h6v1H1zM3 2h2v4H3z'/%3E%3C/svg%3E"
    />
    <title>Pixel Descent</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="stage">
      <canvas id="game" aria-label="Pixel Descent game canvas" role="img"></canvas>
      <button id="pause-btn" type="button" aria-label="Pause">II</button>
    </div>
    <div id="status" class="sr-only" role="status" aria-live="polite"></div>
    <noscript>Pixel Descent needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
